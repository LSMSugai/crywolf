on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

# one build at a time, in order: a slower older build must not deploy over a
# newer one
concurrency:
  group: pkgdown
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # sheepdog and cmdstanr (Suggests) are published there, not on CRAN
          extra-repositories: https://diogoprov.r-universe.dev https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Month and runner image, for the CmdStan cache key
        id: month
        run: |
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          # same key as in R-CMD-check.yaml, so the workflows share it; without the
          # image, a CmdStan built on another Ubuntu is restored and no chain runs
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.image }}-${{ steps.month.outputs.month }}
      - name: Install CmdStan
        run: |
          # a cache restored from an interrupted build has no stanc: reinstall
          v <- cmdstanr::cmdstan_version(error_on_NA = FALSE)
          # and crywolf needs CmdStan 2.40 or later
          if (is.null(v) || utils::compareVersion(v, "2.40.0") < 0 ||
              !file.exists(file.path(cmdstanr::cmdstan_path(), "bin", "stanc"))) {
            cmdstanr::install_cmdstan(cores = 2, overwrite = TRUE)
          }
        shell: Rscript {0}
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
