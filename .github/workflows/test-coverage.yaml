# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # the Stan tests call skip_on_cran(): run them so that they count
      NOT_CRAN: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # sheepdog and cmdstanr (Suggests) are published there, not on CRAN
          extra-repositories: https://diogoprov.r-universe.dev https://stan-dev.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        timeout-minutes: 25
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Month and runner image, for the CmdStan cache key
        id: month
        run: |
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          # same key as in R-CMD-check.yaml, so the two workflows share it
          key: cmdstan-${{ runner.os }}-${{ runner.arch }}-${{ steps.month.outputs.image }}-${{ steps.month.outputs.month }}
      - name: Install CmdStan
        run: |
          # a cache restored from an interrupted build has no stanc: reinstall
          v <- cmdstanr::cmdstan_version(error_on_NA = FALSE)
          # and crywolf needs CmdStan 2.40 or later
          if (is.null(v) || utils::compareVersion(v, "2.40.0") < 0 ||
              !file.exists(file.path(cmdstanr::cmdstan_path(), "bin", "stanc"))) {
            cmdstanr::install_cmdstan(cores = 2, overwrite = TRUE)
          }
          cat("CmdStan", cmdstanr::cmdstan_version(), "\n")
        shell: Rscript {0}
      - name: Test coverage
        # covr measures the R code only; the Stan model is compiled when covr
        # installs the instrumented package
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: codecov/codecov-action@v5
        with:
          # a Codecov outage fails the run on main, not on pull requests
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
